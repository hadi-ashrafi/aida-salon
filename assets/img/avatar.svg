<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>تصویر پیش‌فرض</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE7EE"/><stop offset="1" stop-color="#F9EADF"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4486C"/><stop offset="1" stop-color="#7E2445"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9668B"/><stop offset="1" stop-color="#A32E54"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="158" cy="42" r="38" fill="#FFFFFF" opacity=".45"/>
  <circle cx="30" cy="170" r="30" fill="#FFFFFF" opacity=".3"/>
  <!-- موی پشت سر -->
  <path d="M100 40c-31 0-50 23-50 54c0 24-4 41-14 56h128c-10-15-14-32-14-56c0-31-19-54-50-54z" fill="url(#hair)"/>
