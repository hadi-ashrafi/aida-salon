  <ellipse cx="100" cy="90" rx="28" ry="33" fill="#F7D3C4"/>
  <!-- چتری -->
  <path d="M71 86c2-24 18-37 37-35c16 2 24 15 22 33c-15-3-29-11-38-22c-5 11-12 19-21 24z" fill="url(#hair)"/>
  <!-- شانه‌ها -->
  <path d="M38 200c2-32 27-54 62-54s60 22 62 54z" fill="url(#cloth)"/>
  <path d="M86 146c4 8 9 12 14 12s10-4 14-12" fill="none" stroke="#F7D3C4" stroke-width="3" stroke-linecap="round" opacity=".6"/>
</svg>
